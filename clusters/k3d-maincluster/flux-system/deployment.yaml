apiVersion: v1
kind: Namespace
metadata:
  name: ppp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pppbot
  namespace: ppp 
spec:
  selector:
    matchLabels:
      app: pppbot
  template:
    metadata:
      labels:
        app: pppbot
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: pppbot-container
        image: ghcr.io/poppyprograms/pppbot:main-1771925297
        imagePullPolicy: Always
        env:
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: pppsecrets
              key: WEBHOOK_URL
        - name: DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              name: pppsecrets
              key: DISCORD_TOKEN
        - name: GUILD_ID
          valueFrom:
            secretKeyRef:
              name: pppsecrets
              key: GUILD_ID
        - name: CDS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: pppsecrets
              key: CDS_AUTH_TOKEN
