apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: pppbot
  namespace: flux-system
spec:
  image: ghcr.io/poppyprograms/pppbot
  interval: 1m0s
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: pppbot
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pppbot
  filterTags:
    pattern: "^main.*"
  policy:
    alphabetical:
      order: asc
