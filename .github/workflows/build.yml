name: Build the docker image
run-name: The bot is building the latest docker image by ${{github.actor}}
on:
  - push

jobs:
  deployment:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #- name: Extract branch name
      #  shell: bash
      #  run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      #  id: get_branch

      #- name: Extract branch name and lowercase repo
      #  shell: bash
      #  run: |
      #    # Get branch name
      #    echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      #    # Convert Repo Name to lowercase
      #    echo "repo=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT
      #  id: vars

      - name: Extract branch and lowercase repo
        id: vars
        run: |
          BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.branch }}

